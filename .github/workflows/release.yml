name: Выпуск

# Новая версия в package.json на main → GitHub собирает переносной exe на Windows (вместе с jar плагина RuneLite),
# ставит тег vX.Y.Z и выкладывает релиз с описанием из release-notes/vX.Y.Z.md. Версия, у которой релиз уже есть,
# повторно не собирается. Запустить вручную — Actions → «Выпуск» → Run workflow.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Релиз v$version уже есть — пропускаю."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - if: steps.v.outputs.exists == 'false'
        run: npm ci
      - if: steps.v.outputs.exists == 'false'
        run: npm run check-data
      - if: steps.v.outputs.exists == 'false'
        run: npm test
      - if: steps.v.outputs.exists == 'false'
        run: npm run dist:win
      - if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OSRS Путь ${{ steps.v.outputs.version }}
          body_path: release-notes/v${{ steps.v.outputs.version }}.md
          files: release/*.exe
          fail_on_unmatched_files: true
