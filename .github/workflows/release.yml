name: Release

# A new version in package.json on main → GitHub builds the portable exe on Windows (together with the RuneLite plugin jar),
# sets the tag vX.Y.Z and publishes a release with the description from release-notes/vX.Y.Z.md. A version that already has a release
# is not built again. To run it by hand — Actions → "Release" → Run workflow.
# An unreleased version can be corrected and rebuilt; an existing release is never overwritten. Funding UI gates cover both funded and unfunded accounts.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - if: steps.v.outputs.exists == 'false'
        run: npm ci
      # npm 11 does not run the package install scripts by itself — we download Electron explicitly to build the exe.
      - if: steps.v.outputs.exists == 'false'
        run: node node_modules/electron/install.js
      - if: steps.v.outputs.exists == 'false'
        run: npm run check-data
      - if: steps.v.outputs.exists == 'false'
        run: npm test
      - if: steps.v.outputs.exists == 'false'
        run: ./runelite-bridge/gradlew.bat --project-dir ./runelite-bridge --no-daemon test
      - if: steps.v.outputs.exists == 'false'
        run: npm run dist:win
      - if: steps.v.outputs.exists == 'false'
        run: npx playwright install chromium
      - if: steps.v.outputs.exists == 'false'
        run: npm run test:ui
      - if: steps.v.outputs.exists == 'false'
        run: npm run test:e2e
      - if: steps.v.outputs.exists == 'false'
        name: Verify the isolated portable executable before publishing
        shell: pwsh
        run: ./.github/scripts/test-portable.ps1
      - if: steps.v.outputs.exists == 'false'
        name: Attach the continuation handoff and verified EXE digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath release -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected one verified portable EXE.' }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($files[0].Name)" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          $handoff = Get-Content -LiteralPath PROJECT_HANDOFF.md -Raw
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $receipt = @(
            '<!-- DELIVERY_START -->',
            '## Delivery receipt', '',
            "Release: **$version**. Source: ``$env:GITHUB_SHA``.",
            "Portable: $($files[0].Name), $($files[0].Length) bytes.",
            "SHA256: ``$hash``.", '',
            'Release build/data/unit/Java/browser/native/isolated-EXE gates passed before publication. No in-game verification is claimed. Independent post-download verification is recorded in the current main-branch handoff.',
            '<!-- DELIVERY_END -->'
          ) -join "`n"
          $handoff = [regex]::Replace($handoff, '(?s)<!-- DELIVERY_START -->.*?<!-- DELIVERY_END -->', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $receipt })
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release/PROJECT_HANDOFF.md'), $handoff, [Text.UTF8Encoding]::new($false))
      - if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OSRS Path ${{ steps.v.outputs.version }}
          body_path: release-notes/v${{ steps.v.outputs.version }}.md
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/PROJECT_HANDOFF.md
          fail_on_unmatched_files: true
