name: Release

# A new version in package.json on main → GitHub builds the portable exe on Windows (together with the RuneLite plugin jar),
# sets the tag vX.Y.Z and publishes a release with the description from release-notes/vX.Y.Z.md. A version that already has a release
# is not built again. To run it by hand — Actions → "Release" → Run workflow.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.v.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - if: steps.v.outputs.exists == 'false'
        run: npm ci
      # npm 11 does not run the package install scripts by itself — we download Electron explicitly to build the exe.
      - if: steps.v.outputs.exists == 'false'
        run: node node_modules/electron/install.js
      - if: steps.v.outputs.exists == 'false'
        run: npm run check-data
      - if: steps.v.outputs.exists == 'false'
        run: npm test
      - if: steps.v.outputs.exists == 'false'
        run: npm run dist:win
      - if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OSRS Path ${{ steps.v.outputs.version }}
          body_path: release-notes/v${{ steps.v.outputs.version }}.md
          files: release/*.exe
          fail_on_unmatched_files: true
