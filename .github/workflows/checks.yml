name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Для проверок Electron не нужен — не качаем его бинарник.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-data
      - run: npm test
      - run: npm run build

  runelite-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runelite-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Плагин компилируется против RuneLite 1.12.39; тесты сверяют названия квестов маршрута с API клиента.
      - run: chmod +x gradlew && ./gradlew --no-daemon test
