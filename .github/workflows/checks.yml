name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Electron is not needed for the checks — we do not download its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-data
      - run: npm test
      - run: npm run build
      # The interface in a real browser: readiness, shopping, gear, the map, the header (scripts/ui-smoke.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  runelite-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runelite-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The plugin is compiled against RuneLite 1.12.39; the tests compare the route quest names with the client API.
      - run: chmod +x gradlew && ./gradlew --no-daemon test
