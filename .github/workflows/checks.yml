name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Chromium dependencies can consume ten minutes on a slow apt mirror.
    # Leave time for the full browser suite after installation; no gate is skipped.
    timeout-minutes: 25
    env:
      # Electron is not needed for the checks — we do not download its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-data
      # Change hygiene guards (PROJECT_HANDOFF.md): the structure report, unused files/dependencies, dead CSS.
      - run: npm run check-structure
      - run: npm run knip
      - run: npm run dead-css
      - run: npm test
      - run: npm run build
      # The interface in a real browser: readiness, shopping, gear, the map, the header (scripts/test/ui).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  runelite-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runelite-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The plugin is compiled against RuneLite 1.12.39; the tests compare the route quest names with the client API.
      - run: chmod +x gradlew && ./gradlew --no-daemon test

  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist:win
      - run: npm run test:e2e
      - name: Verify the isolated portable executable
        shell: pwsh
        run: ./.github/scripts/test-portable.ps1
      - name: Keep the verified portable for the release job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 3
      - name: Preserve the verified audit preview
        if: ((startsWith(github.head_ref, 'codex/audit-block-') || github.head_ref == 'codex/audit-test-build' || github.head_ref == 'codex/audit-test-build-2' || github.head_ref == 'codex/audit-test-build-3' || github.head_ref == 'codex/audit-test-build-4' || github.head_ref == 'codex/audit-test-build-5') && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: audit-preview-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  audit-preview:
    if: (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/audit-block-') || github.head_ref == 'codex/audit-test-build' || github.head_ref == 'codex/audit-test-build-2' || github.head_ref == 'codex/audit-test-build-3' || github.head_ref == 'codex/audit-test-build-4' || github.head_ref == 'codex/audit-test-build-5') && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [checks, runelite-bridge, portable]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audit-preview-portable
          path: audit-candidate
      - name: Publish a separate test download after every gate passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath audit-candidate -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one verified portable EXE.' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA.' }
          $short = $env:SOURCE_SHA.Substring(0, 8)
          $tag = "audit-test-$short"
          $name = "OSRS-Path-audit-test-$short.exe"
          $candidate = Join-Path audit-candidate $name
          Move-Item -LiteralPath $files[0].FullName -Destination $candidate
          $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath audit-candidate/SHA256SUMS.txt -Encoding utf8
          $handoff = Join-Path audit-candidate 'PROJECT_HANDOFF.md'
          Copy-Item -LiteralPath PROJECT_HANDOFF.md -Destination $handoff
          & gh release create $tag $candidate audit-candidate/SHA256SUMS.txt $handoff --prerelease --latest=false --target $env:SOURCE_SHA --title "OSRS Path audit test $short" --notes "Isolated CI review build. Read PROJECT_HANDOFF.md for current project context. Normal Portable releases are published separately."
          if ($LASTEXITCODE -ne 0) { throw 'Audit preview publication failed.' }

  release:
    # A new version in package.json on main publishes the exe that the portable job verified (no second build),
    # then downloads the published assets and fails unless they match. An existing release is never overwritten.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, runelite-bridge, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: verified-portable
          path: release
      - if: steps.v.outputs.exists == 'false'
        name: Attach the continuation handoff and verified EXE digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath release -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected one verified portable EXE.' }
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($files[0].Name)" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          $handoff = Get-Content -LiteralPath PROJECT_HANDOFF.md -Raw
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $receipt = @(
            '<!-- DELIVERY_START -->',
            '## Delivery receipt', '',
            "Release: **$version**. Source: ``$env:GITHUB_SHA``.",
            "Portable: $($files[0].Name), $($files[0].Length) bytes.",
            "SHA256: ``$hash``.", '',
            'Release build/data/unit/Java/browser/native/isolated-EXE gates passed before publication. No in-game verification is claimed. The release job downloads the published assets and fails unless they match this receipt.',
            '<!-- DELIVERY_END -->'
          ) -join "`n"
          $handoff = [regex]::Replace($handoff, '(?s)<!-- DELIVERY_START -->.*?<!-- DELIVERY_END -->', [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $receipt })
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release/PROJECT_HANDOFF.md'), $handoff, [Text.UTF8Encoding]::new($false))
      - if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OSRS Path ${{ steps.v.outputs.version }}
          body_path: release-notes/v${{ steps.v.outputs.version }}.md
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/PROJECT_HANDOFF.md
          fail_on_unmatched_files: true
      - name: Download the published assets and check them against the verified build
        if: steps.v.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.v.outputs.version }}"
          dir="$RUNNER_TEMP/published"; mkdir -p "$dir"
          gh release download "$v" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          for f in release/*; do cmp "$f" "$dir/$(basename "$f")"; done
          (cd "$dir" && sha256sum -c SHA256SUMS.txt)
          gh release view "$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " " + .digest' | while read -r name digest; do
            [ "$digest" = "sha256:$(sha256sum "$dir/$name" | cut -d' ' -f1)" ] || { echo "::error::$name: published digest $digest does not match the download"; exit 1; }
          done
          echo "The published assets match the verified build."
