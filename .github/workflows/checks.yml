name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Chromium dependencies can consume ten minutes on a slow apt mirror.
    # Leave time for the full browser suite after installation; no gate is skipped.
    timeout-minutes: 25
    env:
      # Electron is not needed for the checks — we do not download its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-data
      - run: npm test
      - run: npm run build
      # The interface in a real browser: readiness, shopping, gear, the map, the header (scripts/ui-smoke.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  runelite-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runelite-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # The plugin is compiled against RuneLite 1.12.39; the tests compare the route quest names with the client API.
      - run: chmod +x gradlew && ./gradlew --no-daemon test

  portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run dist:win
      - run: npm run test:e2e
      - name: Verify the isolated portable executable
        shell: pwsh
        run: ./.github/scripts/test-portable.ps1
      - name: Preserve the verified audit preview
        if: github.event_name == 'push' || ((startsWith(github.head_ref, 'codex/audit-block-') || github.head_ref == 'codex/audit-test-build' || github.head_ref == 'codex/audit-test-build-2' || github.head_ref == 'codex/audit-test-build-3' || github.head_ref == 'codex/audit-test-build-4' || github.head_ref == 'codex/audit-test-build-5') && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: audit-preview-portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  audit-preview:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/audit-block-') || github.head_ref == 'codex/audit-test-build' || github.head_ref == 'codex/audit-test-build-2' || github.head_ref == 'codex/audit-test-build-3' || github.head_ref == 'codex/audit-test-build-4' || github.head_ref == 'codex/audit-test-build-5') && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [checks, runelite-bridge, portable]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audit-preview-portable
          path: audit-candidate
      - name: Publish a separate test download after every gate passes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath audit-candidate -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one verified portable EXE.' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA.' }
          $short = $env:SOURCE_SHA.Substring(0, 8)
          $tag = "audit-test-$short"
          $name = "OSRS-Path-audit-test-$short.exe"
          $candidate = Join-Path audit-candidate $name
          Move-Item -LiteralPath $files[0].FullName -Destination $candidate
          $hash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath audit-candidate/SHA256SUMS.txt -Encoding utf8
          $handoff = Join-Path audit-candidate 'CLAUDE_NEXT_SESSION.md'
          Copy-Item -LiteralPath docs/CLAUDE_NEXT_SESSION.md -Destination $handoff
          & gh release create $tag $candidate audit-candidate/SHA256SUMS.txt $handoff --prerelease --latest=false --target $env:SOURCE_SHA --title "OSRS Path audit test $short" --notes-file docs/CODEX_AUDIT_PREVIEW.md
          if ($LASTEXITCODE -ne 0) { throw 'Audit preview publication failed.' }
