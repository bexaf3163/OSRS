// The RuneLite plugin "OSRS Path Bridge": a bridge between the "OSRS Path" app and the game.
// The build follows the official template github.com/runelite/example-plugin.

plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex('net\\.runelite.*')
		}
	}
	mavenCentral()
}

// The client version the plugin was verified against (matches the installed RuneLite).
// The RuneLite template writes 'latest.release'; here the version is pinned so that the build does not change by itself.
def runeLiteVersion = '1.12.39'
def pluginMainClass = 'com.osrspath.bridge.OsrsPathBridgeTest'

dependencies {
	// Gson, Guice, OkHttp and the game API come with the client: we do not pack them into the plugin.
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.osrspath'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// Built with JDK 17; the bytecode is Java 11, as the RuneLite template and the Plugin Hub require.
	// The RuneLite client runs on Java 17 and loads such a plugin.
	options.release.set(11)
	// We do not use RuneLite's deprecated APIs (WidgetInfo and the like): the compiler will say if one slips through.
	options.compilerArgs << '-Xlint:deprecation'
}

// The danger zones are the same data as the app: src/data/dangerZones.json goes into the jar next to the classes.
processResources {
	from('../src/data/dangerZones.json') {
		into 'com/osrspath/bridge'
	}
	// The quest state machines (the Quest Helper conditions by which the stage step is chosen) are also the same data as the app.
	from('../src/data/questMachines.json') {
		into 'com/osrspath/bridge'
	}
}

// The tests read the app's route to check quest names and message patterns.
test {
	systemProperty 'osrsPath.steps', file('../src/data/steps.json').absolutePath
	// RuneLite fonts (FontManager) create the ~/.runelite/fonts folder on loading: in tests it is a separate one,
	// the player's real RuneLite folder is not touched. Pictures are drawn without a window.
	systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
	systemProperty 'java.awt.headless', 'true'
}

// The plugin as a single file: the "OSRS Path" app puts it into the exe and launches it with the installed RuneLite.
jar {
	archiveFileName = 'osrs-path-bridge.jar'
	manifest {
		attributes('Implementation-Title': 'OSRS Path Bridge', 'Implementation-Version': project.version)
	}
}

// The RuneLite client in developer mode with this plugin: ./gradlew run
// -PruneliteHome=<folder> is a separate settings folder instead of ~/.runelite (RuneLite takes it from user.home).
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs '-ea'
	if (project.hasProperty('runeliteHome')) {
		jvmArgs "-Duser.home=${project.property('runeliteHome')}"
	}
	args '--developer-mode', '--debug'
}
